<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Microbiology Microscope / Petri Dish Icon -->
  <circle cx="50" cy="50" r="38" fill="url(#navGrad)" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#bioGrad)" stroke-width="4" stroke-dasharray="6,3" />
  
  <!-- Microbe/Cell Nucleus -->
  <circle cx="50" cy="50" r="14" fill="url(#bioGrad)" />
  <circle cx="44" cy="44" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="62" cy="42" r="5" fill="#2563eb" />
  <circle cx="42" cy="60" r="4" fill="#10b981" />

  <!-- MINDORA Text -->
  <text x="105" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="1">MINDORA</text>
  
  <!-- Subtitle Text -->
  <text x="106" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12" fill="#10b981" letter-spacing="3">MICROBIOLOGY EXHIBITION</text>
</svg>
